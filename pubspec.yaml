name: druna_app
description: "Druna — find common free time with friends."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  adaptive_platform_ui: ^1.0.2
  shared_preferences: ^2.5.6
  progressive_blur: ^0.0.2
  flutter_svg: ^2.3.2
  device_calendar_plus: ^0.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  # Onest — the UI font; Unbounded — the event page title and one of the
  # avatar letter's fonts (docs/design-system.md §3, docs/avatar.md). All OFL.
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Variable.ttf
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
    # The other avatar letter fonts (lib/shared/ui/avatar_style.dart).
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/avatar/PlayfairDisplay-Variable.ttf
    - family: Lobster
      fonts:
        - asset: assets/fonts/avatar/Lobster-Regular.ttf
    - family: Oswald
      fonts:
        - asset: assets/fonts/avatar/Oswald-Variable.ttf
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/avatar/Comfortaa-Variable.ttf

  # The event page's and the onboarding's moving background
  # (event_gradient.dart) and the calendar's week bands (band_paint.dart).
  shaders:
    - shaders/event_gradient.frag
    - shaders/week_band.frag

  # The logo, the onboarding's arrow and the chevron (lib/shared/ui/brand.dart).
  assets:
    - assets/branding/
